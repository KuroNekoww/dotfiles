# Noctalia v5 configuration
# Converted from v4 settings.json for your environment
# Monitors: DP-1 (Xiaomi, 1920x1080@180Hz)
# Compositor: niri
# Hot-reload is enabled — most changes take effect immediately

# ── Shell ─────────────────────────────────────────────────────────────────────

[shell]
ui_scale              = 1.0
corner_radius_scale   = 1.0
font_family           = "Noto Sans"
time_format           = "{:%H:%M}"
date_format           = "%A, %x"
offline_mode          = false
telemetry_enabled     = true
polkit_agent          = false
password_style        = "default"
settings_show_advanced = false
middle_click_opens_widget_settings = true
show_location         = true
clipboard_enabled     = true
clipboard_history_max_entries = 100
clipboard_auto_paste  = "auto"
clipboard_image_action_command = ""
shared_gl_context     = true
lang                  = ""
avatar_path           = "/home/kuronekoww/图片/插画39-1.png"

[shell.animation]
enabled = true
speed   = 0.59

[shell.shadow]
direction = "down"
alpha     = 0.55

[shell.panel]
transparency_mode          = "solid"
borders                    = true
shadow                     = true
launcher_placement         = "floating"
launcher_position          = "center"
clipboard_placement        = "floating"
clipboard_position         = "center"
control_center_placement   = "attached"
wallpaper_placement        = "attached"
session_placement          = "attached"
open_near_click_control_center = false
open_near_click_launcher       = false
open_near_click_clipboard      = false
open_near_click_wallpaper      = false
open_near_click_session        = false

[shell.mpris]
blacklist = []

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled             = true
fill_mode           = "crop"
fill_color          = "#1a1a2e"
transition          = ["disc", "fade", "stripes", "wipe", "pixelate", "honeycomb"]
transition_duration = 4600
edge_smoothness     = 0.14
transition_on_startup = false
directory           = "/home/kuronekoww/图片/WallPapers"

[wallpaper.automation]
enabled           = true
interval_seconds  = 300
order             = "random"
recursive         = true

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode   = "dark"
source = "wallpaper"
builtin = "Kanagawa"
wallpaper_scheme = "muted"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["niri", "starship", "gtk3", "gtk4", "alacritty", "btop"]
enable_community_templates = true
community_ids = []

# ── Backdrop ──────────────────────────────────────────────────────────────────

[backdrop]
enabled                = false
blur_intensity         = 0.5
tint_intensity         = 0.3

# ── Notifications ─────────────────────────────────────────────────────────────

[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true
layer              = "overlay"
scale              = 1.0
background_opacity = 1.0
offset_x           = 20
offset_y           = 8

[notification.filter.discord]
enabled      = true
match        = "discord"
show_toast   = false
save_history = true
play_sound   = false

[notification.filter.firefox]
enabled      = true
match        = "firefox"
show_toast   = false
save_history = true
play_sound   = false

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
position          = "top_right"
position_vertical = "top_center"
orientation       = "horizontal"
scale             = 1.0
background_opacity = 1.0
offset_x          = 20
offset_y          = 8

[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
nightlight = true
dnd = true
lock_keys = true
keyboard_layout = true
privacy = true

# ── Lock Screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled         = true
blurred_desktop = true
blur_intensity  = 0.54
tint_intensity  = 0.28

# ── System Monitor ────────────────────────────────────────────────────────────

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds = 10.0

# ── Weather ───────────────────────────────────────────────────────────────────

[weather]
enabled         = true
refresh_minutes = 30
unit            = "celsius"
effects         = true

# ── Audio ─────────────────────────────────────────────────────────────────────

[audio]
enable_overdrive   = false
enable_sounds      = true
sound_volume       = 0.5
volume_change_sound = ""
notification_sound  = ""

# ── Brightness ────────────────────────────────────────────────────────────────

[brightness]
enable_ddcutil = false

# ── Night Light ───────────────────────────────────────────────────────────────

[nightlight]
enabled           = false
force             = false
temperature_day   = 6500
temperature_night = 4000

# ── Location ──────────────────────────────────────────────────────────────────

[location]
auto_locate = false
address     = "Zhejiang"

# ── Idle ──────────────────────────────────────────────────────────────────────

[idle]
pre_action_fade_seconds = 5.0
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
timeout = 660
command = "noctalia:session lock"
enabled = true

[idle.behavior.screen-off]
timeout = 600
command = "noctalia:dpms-off"
resume_command = "noctalia:dpms-on"
enabled = true

[idle.behavior.lock-and-suspend]
timeout = 1800
command = "noctalia:session suspend"
enabled = true

# ── Keybinds ──────────────────────────────────────────────────────────────────

[keybinds]
validate     = ["return", "kp_enter", "space"]
cancel       = ["escape"]
left         = ["left"]
right        = ["right"]
up           = ["up"]
down         = ["down"]
tab_next     = ["tab"]
tab_previous = ["shift+iso_left_tab"]

# ── Bar ───────────────────────────────────────────────────────────────────────
# Vertical bar on the left side, matching your v4 layout

[bar.main]
position           = "left"
thickness          = 34
background_opacity = 0.93
radius             = 12
margin_edge        = 4
margin_ends        = 4
padding            = 2
widget_spacing     = 6
scale              = 1.0
shadow             = true
auto_hide          = false
show_on_workspace_switch = true
reserve_space      = true
capsule            = true
capsule_fill       = "surface_variant"
capsule_opacity    = 0.16

# Vertical bar (left): start=top, center=middle, end=bottom
start  = ["launcher", "clock", "cpu", "active_window", "media"]
center = ["workspaces"]
end    = ["tray", "notifications", "volume", "brightness", "control-center"]

[bar.main.dead_zone]
right_command = "noctalia msg control-center toggle"

# ── Dock ──────────────────────────────────────────────────────────────────────
# Bottom auto-hide dock with your most-used apps

[dock]
enabled             = true
position            = "bottom"
icon_size           = 48
main_axis_padding   = 16
cross_axis_padding  = 8
item_spacing        = 6
background_opacity  = 0.61
radius              = 16
margin_edge         = 4
margin_ends         = 0
shadow              = true
show_running        = true
auto_hide           = true
reserve_space       = false
active_scale        = 1.0
inactive_scale      = 0.46
magnification       = true
magnification_scale = 1.45
active_opacity      = 1.0
inactive_opacity    = 0.46
show_dots           = false
show_instance_count = false
launcher_position   = "end"
launcher_icon       = "grid-dots"
active_monitor_only = true
pinned              = [
    "google-chrome-stable",
    "Alacritty",
    "kando",
    "flclash",
    "mpv",
    "btop",
    "com.obsproject.Studio",
    "org.kde.dolphin",
]

# ── Control Center ────────────────────────────────────────────────────────────

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "screen_recorder"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "session"

# ── Hooks ─────────────────────────────────────────────────────────────────────

[hooks]
wallpaper_changed = ["bash /home/kuronekoww/.config/noctalia/apply-morandi.sh"]

# ── Widget Customization ──────────────────────────────────────────────────────

[notification.filter.chrome]
enabled      = true
match        = "chrome"
show_toast   = false
save_history = true
play_sound   = false

[notification.filter.chromium]
enabled      = true
match        = "chromium"
show_toast   = false
save_history = true
play_sound   = false

[notification.filter.edge]
enabled      = true
match        = "edge"
show_toast   = false
save_history = true
play_sound   = false

[widget.clock]
format          = "{:%H:%M}\n{:%d/%m}"
vertical_format = "{:%H\n%M}"
tooltip_format  = "{:%A, %B %d, %Y}"

[widget.cpu]
stat = "cpu_usage"

[widget.ram]
stat = "ram_used"

[widget.temp]
stat = "cpu_temp"

[widget.active_window]
max_length = 145
min_length = 80
title_scroll = "none"

[widget.media]
max_width       = 145
show_album_art  = true
show_visualizer = true
