# Noctalia v5 configuration (validated against noctalia 5.3.0)
# All app theming is handled by Noctalia theme templates (no external palette script).
# Monitor: eDP-2 (BOE NE160QDM-NZB, 2560x1600@240Hz, scale 1.5)
# Compositor: niri
# Hot-reload is enabled — most changes take effect immediately
#
# NOTE: GUI-saved overrides in ~/.local/state/noctalia/settings.toml are loaded
#       last and win over this file. Run `noctalia config validate` after edits.

# ── Accessibility ─────────────────────────────────────────────────────────────

# ui_scale moved out of [shell] in v5.
[accessibility]
ui_scale = 1.0
high_contrast = false

# ── Shell ─────────────────────────────────────────────────────────────────────

[shell]
corner_radius_scale   = 1.0
font_family           = "Noto Sans"
time_format           = "{:%H:%M}"
date_format           = "%A, %x"
offline_mode          = false
telemetry_enabled     = true
polkit_agent          = false
password_style        = "default"
settings_show_advanced = false
show_location         = true
clipboard_enabled     = true
clipboard_history_max_entries = 100
clipboard_auto_paste  = "auto"
clipboard_image_action_command = ""
shared_gl_context     = true
lang                  = ""
avatar_path           = "/home/kuronekoww/图片/tx.png"

[shell.animation]
enabled = true
speed   = 0.59

[shell.shadow]
direction = "down"
alpha     = 0.55

[shell.panel]
transparency_mode          = "solid"
borders                    = true
shadow                     = true
launcher_placement         = "floating"
launcher_position          = "center"
clipboard_placement        = "floating"
clipboard_position         = "center"
control_center_placement   = "attached"
wallpaper_placement        = "attached"
session_placement          = "attached"
open_near_click_control_center = false
open_near_click_launcher       = false
open_near_click_clipboard      = false
open_near_click_wallpaper      = false
open_near_click_session        = false

[shell.mpris]
blacklist = []

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled             = true
fill_mode           = "crop"
fill_color          = ""
transition          = ["disc", "fade", "stripes", "wipe", "zoom", "honeycomb"]
transition_duration = 4600
edge_smoothness     = 0.14
transition_on_startup = false
directory           = "/home/kuronekoww/图片"

[wallpaper.automation]
enabled           = false
interval_seconds  = 300
order             = "random"
recursive         = true

[wallpaper.default]
path = "/home/kuronekoww/图片/wallhaven-1qodm3.png"

[wallpaper.monitors.eDP-2]
path = "/home/kuronekoww/图片/wallhaven-1qodm3.png"

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode   = "auto"
source = "wallpaper"
builtin = "Kanagawa"
community_palette = "Oxocarbon"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates = true
# All app theming is owned by Noctalia theme templates.
builtin_ids = ["niri", "starship", "gtk3", "gtk4", "alacritty", "btop", "cava", "kcolorscheme", "qt"]
enable_community_templates = true
community_ids = ["fastfetch", "fcitx5", "obs", "micro", "superfile"]

# ── Backdrop ──────────────────────────────────────────────────────────────────

[backdrop]
enabled                = true
blur_intensity         = 0.5
tint_intensity         = 0.3

# ── Notifications ─────────────────────────────────────────────────────────────

[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true
layer              = "overlay"
scale              = 1.0
background_opacity = 1.0
offset_x           = 20
offset_y           = 8

[notification.filter.discord]
enabled      = true
match        = "discord"
show_toast   = false
save_history = true
play_sound   = false

[notification.filter.firefox]
enabled      = true
match        = "firefox"
show_toast   = false
save_history = true
play_sound   = false

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
position          = "top_right"
position_vertical = "top_center"
orientation       = "horizontal"
scale             = 1.0
background_opacity = 1.0
offset_x          = 20
offset_y          = 8

[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
nightlight = true
dnd = true
lock_keys = true
keyboard_layout = true
privacy = true

# ── Lock Screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled         = true
blurred_desktop = true
blur_intensity  = 0.54
tint_intensity  = 0.28

# ── System Monitor ────────────────────────────────────────────────────────────

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds = 10.0

# ── Weather ───────────────────────────────────────────────────────────────────

[weather]
enabled         = true
refresh_minutes = 30
unit            = "celsius"
effects         = true

# ── Audio ─────────────────────────────────────────────────────────────────────

[audio]
enable_overdrive   = false
enable_sounds      = true
sound_volume       = 0.5
# Per-event toggles replace the old volume_change_sound / notification_sound paths.
enable_volume_sounds       = true
enable_notification_sounds = true

# ── Brightness ────────────────────────────────────────────────────────────────

[brightness]
enable_ddcutil = false

# ── Night Light ───────────────────────────────────────────────────────────────

[nightlight]
enabled           = false
force             = false
temperature_day   = 6500
temperature_night = 4000

# ── Location ──────────────────────────────────────────────────────────────────

[location]
auto_locate = false
address     = "Zhejiang"

# ── Idle ──────────────────────────────────────────────────────────────────────

[idle]
pre_action_fade_seconds = 5.0
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

# Use the native actions instead of the v4 "noctalia:<command>" strings.
[idle.behavior.lock]
timeout = 660
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 600
action = "screen_off"
enabled = true

[idle.behavior.lock-and-suspend]
timeout = 1800
action = "lock_and_suspend"
enabled = true

# ── Keybinds ──────────────────────────────────────────────────────────────────

[keybinds]
validate     = ["return", "kp_enter", "space"]
cancel       = ["escape"]
left         = ["left"]
right        = ["right"]
up           = ["up"]
down         = ["down"]
tab_next     = ["tab"]
tab_previous = ["shift+iso_left_tab"]

# ── Bar ───────────────────────────────────────────────────────────────────────
# Top bar (GUI override synced back into this file)

[bar.main]
position           = "top"
thickness          = 34
background_opacity = 0.93
radius             = 12
margin_edge        = 4
margin_ends        = 4
padding            = 2
widget_spacing     = 6
scale              = 1.0
shadow             = true
auto_hide          = false
show_on_workspace_switch = true
reserve_space      = true
capsule            = true
capsule_fill       = "surface_variant"
capsule_opacity    = 0.16

# Horizontal bar (top): start=left, center=middle, end=right
start  = ["launcher", "clock", "cpu", "active_window", "media"]
center = ["workspaces"]
end    = ["tray", "notifications", "volume", "brightness", "control-center"]

# v5: middle click on any widget is a gesture binding, not a [shell] boolean.
# The built-in default already opens the widget's settings; this states it explicitly.
[bar.main.actions]
middle = "settings-open-widget"

# Dead zone = the bar margins outside the widget sections.
[bar.main.dead_zone.actions]
right = "panel-toggle control-center"

# ── Dock ──────────────────────────────────────────────────────────────────────
# Bottom auto-hide dock with your most-used apps

[dock]
enabled             = true
position            = "bottom"
icon_size           = 48
main_axis_padding   = 16
cross_axis_padding  = 8
item_spacing        = 6
background_opacity  = 0.61
radius              = 16
margin_edge         = 4
margin_ends         = 0
shadow              = true
show_running        = true
auto_hide           = true
reserve_space       = false
active_scale        = 1.0
inactive_scale      = 0.46
magnification       = true
magnification_scale = 1.45
active_opacity      = 1.0
inactive_opacity    = 0.46
show_dots           = false
show_instance_count = false
launcher_position   = "end"
launcher_icon       = "grid-dots"
active_monitor_only = true
pinned              = [
    "google-chrome",
    "Alacritty",
    "flclash",
    "mpv",
    "btop",
    "com.obsproject.Studio",
    "org.kde.dolphin",
]

# ── Control Center ────────────────────────────────────────────────────────────

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

# ── Widget Customization ──────────────────────────────────────────────────────

[notification.filter.chrome]
enabled      = true
match        = "chrome"
show_toast   = false
save_history = true
play_sound   = false

[notification.filter.chromium]
enabled      = true
match        = "chromium"
show_toast   = false
save_history = true
play_sound   = false

[notification.filter.edge]
enabled      = true
match        = "edge"
show_toast   = false
save_history = true
play_sound   = false

[widget.clock]
format          = "{:%H:%M}\n{:%d/%m}"
vertical_format = "{:%H\n%M}"
tooltip_format  = "{:%A, %B %d, %Y}"

[widget.cpu]
stat = "cpu_usage"

[widget.ram]
stat = "ram_used"

[widget.temp]
stat = "cpu_temp"

[widget.active_window]
max_length = 145
min_length = 80
title_scroll = "none"

[widget.media]
max_length      = 145
min_length      = 80
title_scroll    = "none"
hide_album_art  = false
# v5 has no inline media visualizer; use the audio_visualizer widget for that.
hide_when_no_media = false


# ── Lockscreen layout (GUI-managed, synced from state) ────────────────────────

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1", "lockscreen-login-box@eDP-2"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
